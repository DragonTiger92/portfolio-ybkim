name: Maintenance specification item
description: Track one repository, CI, documentation, or operations specification item.
title: "chore: "
labels:
  - type:docs
  - release:not-applicable
body:
  - type: markdown
    attributes:
      value: |
        Use this for one non-feature specification item such as docs, CI, repository policy, or maintenance.
  - type: input
    id: spec_id
    attributes:
      label: Feature specification ID
      description: Link this issue to `docs/planning/feature-specifications.md` when possible.
      placeholder: FS-003
    validations:
      required: false
  - type: dropdown
    id: phase
    attributes:
      label: Roadmap phase
      options:
        - PH-001
        - PH-002
        - PH-003
        - PH-004
      default: 0
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be improved or made ready?
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      description: List the concrete work items.
      placeholder: "- ..."
    validations:
      required: true
  - type: dropdown
    id: primary_area
    attributes:
      label: Primary area
      options:
        - type:docs
        - type:ci
        - type:infra
        - type:security
        - type:deps
        - type:content
      default: 0
    validations:
      required: true
