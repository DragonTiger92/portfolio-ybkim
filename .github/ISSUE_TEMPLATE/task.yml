name: Maintenance backlog item
description: Track one repository, CI, documentation, or operations Product Backlog Item.
title: "chore: "
labels:
  - type:docs
  - release:not-applicable
body:
  - type: markdown
    attributes:
      value: |
        Use this for one non-product Product Backlog Item such as docs, CI, repository policy, or maintenance.
  - type: input
    id: pbi_id
    attributes:
      label: Product Backlog Item ID
      description: Link this issue to `docs/planning/product-backlog.md` when possible.
      placeholder: PBI-003
    validations:
      required: false
  - type: dropdown
    id: phase
    attributes:
      label: Roadmap phase
      options:
        - PH-001
        - PH-002
        - PH-003
        - PH-004
      default: 0
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be improved or made ready?
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      description: List the concrete work items.
      placeholder: "- ..."
    validations:
      required: true
  - type: dropdown
    id: primary_area
    attributes:
      label: Primary area
      options:
        - type:docs
        - type:ci
        - type:infra
        - type:security
        - type:deps
        - type:content
      default: 0
    validations:
      required: true
