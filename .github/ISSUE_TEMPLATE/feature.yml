name: Feature specification item
description: Track one feature specification item from the planning docs.
title: "feat: "
labels:
  - type:feature
body:
  - type: markdown
    attributes:
      value: |
        Use this for one feature specification item. A phase-sized pull request can close multiple issues.
  - type: input
    id: spec_id
    attributes:
      label: Feature specification ID
      description: Link this issue to `docs/planning/feature-specifications.md` when possible.
      placeholder: FS-006
    validations:
      required: false
  - type: dropdown
    id: phase
    attributes:
      label: Roadmap phase
      options:
        - PH-001
        - PH-002
        - PH-003
        - PH-004
        - PH-005
      default: 2
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What outcome should this change create?
      placeholder: State the user-visible result and why it matters.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What should be included or intentionally left out?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true before this issue can close?
      placeholder: "- ..."
    validations:
      required: true
  - type: dropdown
    id: release_impact
    attributes:
      label: Release impact
      options:
        - release:minor
        - release:patch
        - release:major
        - release:not-applicable
      default: 0
    validations:
      required: true
