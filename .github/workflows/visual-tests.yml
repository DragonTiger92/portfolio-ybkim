name: Visual Tests

on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
      artifact-id:
        required: true
        type: string
      update-baselines:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      update-baselines:
        description: Generate reviewed baseline candidates; never commits them.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  visual:
    name: Compare Screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    env:
      PORTFOLIO_VISUAL_IMAGE: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    steps:
      - name: Checkout trusted visual tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Verify tooling revision
        shell: bash
        env:
          REVISION: ${{ github.workflow_sha }}
        run: |
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REVISION"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Download exact candidate
        if: ${{ inputs.artifact-id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.artifact-id }}
          path: .
          merge-multiple: true

      - name: Verify candidate contents
        if: ${{ inputs.artifact-id != '' }}
        env:
          REVISION: ${{ inputs.revision }}
        run: node scripts/validate-artifact-manifest.mjs --revision "$REVISION"

      - name: Build manual candidate
        if: ${{ inputs.artifact-id == '' }}
        env:
          PORTFOLIO_JOB_STATUS: actively-looking
        run: pnpm build:bundle

      - name: Capture differences before updating baselines
        if: ${{ inputs.update-baselines }}
        continue-on-error: true
        run: pnpm test:visual

      - name: Upload pre-update differences for review
        if: ${{ always() && inputs.update-baselines }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-review-${{ github.sha }}
          path: |
            visual-results/
            visual-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Generate baseline candidates
        if: ${{ inputs.update-baselines }}
        run: pnpm test:visual:update

      - name: Compare screenshots
        run: pnpm test:visual

      - name: Verify baseline repeatability
        if: ${{ inputs.update-baselines }}
        run: pnpm test:visual

      - name: Prove intentional CSS regression produces a diff
        if: ${{ inputs.update-baselines }}
        run: pnpm test:visual:probe

      - name: Upload baseline candidates for human review
        if: ${{ inputs.update-baselines }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-baselines-${{ github.sha }}
          path: tests/visual/baselines/
          if-no-files-found: error
          retention-days: 14

      - name: Upload visual diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-diagnostics-${{ inputs.artifact-id || github.run_id }}
          path: |
            visual-results/
            visual-report/
          if-no-files-found: warn
          retention-days: 14
