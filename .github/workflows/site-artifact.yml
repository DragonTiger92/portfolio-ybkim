name: Site Artifact

on:
  workflow_call:
    inputs:
      revision:
        description: Full caller commit SHA; must equal the checked workflow revision.
        required: true
        type: string
      job-status:
        description: Build-time portfolio availability state.
        required: false
        default: actively-looking
        type: string
    outputs:
      artifact-digest:
        description: GitHub-computed digest of the uploaded artifact archive.
        value: ${{ jobs.artifact.outputs['artifact-digest'] }}
      artifact-id:
        description: GitHub artifact identifier.
        value: ${{ jobs.artifact.outputs['artifact-id'] }}
      artifact-url:
        description: Authenticated GitHub URL for the uploaded artifact.
        value: ${{ jobs.artifact.outputs['artifact-url'] }}

permissions:
  contents: read

jobs:
  build:
    name: Build Site Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
      PORTFOLIO_JOB_STATUS: ${{ inputs['job-status'] }}
    outputs:
      artifact-digest: ${{ steps.upload.outputs['artifact-digest'] }}
      artifact-id: ${{ steps.upload.outputs['artifact-id'] }}
      artifact-url: ${{ steps.upload.outputs['artifact-url'] }}
    steps:
      - name: Checkout caller revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false

      - name: Verify caller revision
        env:
          EXPECTED_REVISION: ${{ inputs.revision }}
        shell: bash
        run: |
          if [[ ! "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "revision must be a full lowercase Git SHA" >&2
            exit 1
          fi

          actual_revision="$(git rev-parse HEAD)"
          if [[ "$EXPECTED_REVISION" != "$actual_revision" ]]; then
            echo "revision does not match the checked caller commit" >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run project checks and build
        run: pnpm check

      - name: Create exact-revision artifact manifest
        env:
          ARTIFACT_REVISION: ${{ inputs.revision }}
        run: >-
          node scripts/create-artifact-manifest.mjs
          --revision "$ARTIFACT_REVISION"
          --output tmp/delivery/site-artifact-manifest.json

      - name: Upload candidate site artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-artifact-${{ inputs.revision }}
          path: |
            dist/
            tmp/delivery/site-artifact-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload browser diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-diagnostics-delivery
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn

  visual:
    needs: build
    uses: ./.github/workflows/visual-tests.yml
    with:
      revision: ${{ inputs.revision }}
      artifact-id: ${{ needs.build.outputs.artifact-id }}

  artifact:
    name: Approve Site Artifact
    if: ${{ always() }}
    needs: [build, visual]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      artifact-digest: ${{ needs.build.outputs.artifact-digest }}
      artifact-id: ${{ needs.build.outputs.artifact-id }}
      artifact-url: ${{ needs.build.outputs.artifact-url }}
    steps:
      - name: Checkout gate validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Require every test gate
        env:
          QUALITY_RESULT: ${{ needs.build.result }}
          VISUAL_RESULT: ${{ needs.visual.result }}
        run: node scripts/validate-test-gates.mjs
