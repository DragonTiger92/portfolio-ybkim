name: Site Artifact

on:
  workflow_call:
    inputs:
      revision:
        description: Full checked Git revision to build.
        required: true
        type: string
    outputs:
      artifact-digest:
        description: GitHub-computed digest of the uploaded artifact archive.
        value: ${{ jobs.artifact.outputs.artifact-digest }}
      artifact-id:
        description: GitHub artifact identifier.
        value: ${{ jobs.artifact.outputs.artifact-id }}
      artifact-url:
        description: Authenticated GitHub URL for the uploaded artifact.
        value: ${{ jobs.artifact.outputs.artifact-url }}

permissions:
  contents: read

jobs:
  artifact:
    name: Build Site Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browsers for canonical checks
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run project checks and build
        run: pnpm check

      - name: Create exact-revision artifact manifest
        run: >-
          node scripts/create-artifact-manifest.mjs
          --revision "${{ inputs.revision }}"
          --output tmp/delivery/site-artifact-manifest.json

      - name: Upload checked site artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-artifact-${{ inputs.revision }}
          path: |
            dist/
            tmp/delivery/site-artifact-manifest.json
          if-no-files-found: error
          retention-days: 14
