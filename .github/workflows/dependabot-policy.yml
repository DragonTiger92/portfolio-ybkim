name: Dependabot Policy

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - labeled

permissions:
  contents: read

concurrency:
  group: dependabot-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify Dependabot Update
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Read Dependabot commit metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          commit_messages="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits" --jq '.[].commit.message')"
          dependency_type="$(printf '%s\n' "$commit_messages" | sed -n 's/^[[:space:]]*dependency-type: //p' | sort -u)"
          update_type="$(printf '%s\n' "$commit_messages" | sed -n 's/^[[:space:]]*update-type: //p' | sort -u)"

          case "$HEAD_REF" in
            dependabot/npm_and_yarn/*) ecosystem="npm_and_yarn" ;;
            dependabot/github_actions/*) ecosystem="github_actions" ;;
            *) ecosystem="unknown" ;;
          esac

          if [[ "$dependency_type" == *$'\n'* || -z "$dependency_type" ]]; then
            dependency_type="unknown"
          fi

          if [[ "$update_type" == *$'\n'* || -z "$update_type" ]]; then
            update_type="unknown"
          fi

          has_breaking_marker="false"
          if printf '%s\n%s\n%s\n' "$PR_TITLE" "$PR_BODY" "$commit_messages" | grep -Eiq 'breaking([ -]change|:)'; then
            has_breaking_marker="true"
          fi

          echo "dependency_type=$dependency_type" >> "$GITHUB_OUTPUT"
          echo "ecosystem=$ecosystem" >> "$GITHUB_OUTPUT"
          echo "has_breaking_marker=$has_breaking_marker" >> "$GITHUB_OUTPUT"
          echo "update_type=$update_type" >> "$GITHUB_OUTPUT"

      - name: Summarize owner merge evidence
        env:
          DEPENDENCY_TYPE: ${{ steps.metadata.outputs.dependency_type }}
          ECOSYSTEM: ${{ steps.metadata.outputs.ecosystem }}
          HAS_BREAKING_MARKER: ${{ steps.metadata.outputs.has_breaking_marker }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update_type }}
          VALIDATION_ATTESTED: ${{ contains(github.event.pull_request.labels.*.name, 'deps:validated') }}
        run: |
          {
            echo "## Dependabot owner merge evidence"
            echo
            echo "| Evidence | Value |"
            echo "| --- | --- |"
            echo "| Ecosystem | $ECOSYSTEM |"
            echo "| Dependency type | $DEPENDENCY_TYPE |"
            echo "| Update type | $UPDATE_TYPE |"
            echo "| Breaking marker | $HAS_BREAKING_MARKER |"
            echo "| Repository validation attested | $VALIDATION_ATTESTED |"
          } >> "$GITHUB_STEP_SUMMARY"

  request-owner-review:
    name: Request Owner Merge Review
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Request owner merge review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --add-reviewer DragonTiger92
