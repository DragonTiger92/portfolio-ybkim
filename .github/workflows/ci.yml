name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      update-baselines:
        description: Generate baseline candidates on the selected branch for human review.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.site.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser for accessibility checks
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run project checks
        run: pnpm check

      - name: Create candidate manifest
        env:
          REVISION: ${{ github.sha }}
        run: node scripts/create-artifact-manifest.mjs --revision "$REVISION"

      - name: Upload visual candidate
        id: site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-site-${{ github.sha }}
          path: |
            dist/
            tmp/delivery/site-artifact-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload browser diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-diagnostics-ci
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn

  visual:
    needs: quality
    uses: ./.github/workflows/visual-tests.yml
    with:
      revision: ${{ github.sha }}
      artifact-id: ${{ needs.quality.outputs.artifact-id }}
      update-baselines: ${{ github.event_name == 'workflow_dispatch' && inputs.update-baselines }}

  check:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.update-baselines && 'Baseline Candidates' || 'Check' }}
    if: ${{ always() }}
    needs: [quality, visual]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout gate validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require every test gate
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          VISUAL_RESULT: ${{ needs.visual.result }}
        run: node scripts/validate-test-gates.mjs
