name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      update-baselines:
        description: Generate baseline candidates on the selected branch for human review.
        type: boolean
        default: false
      verify-site-artifact:
        description: Validate Site Artifact approval without deployment.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout scan history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - name: Install pinned scanner
        run: node scripts/install-gitleaks.mjs
      - name: Verify scanner and secret-safe output
        run: node scripts/test-secret-scanner.mjs
      - name: Scan PR commits or current history
        run: node scripts/run-secret-scan.mjs ci

  quality:
    name: Quality
    needs: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    outputs:
      artifact-id: ${{ steps.site.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run project checks
        run: pnpm check

      - name: Create candidate manifest
        env:
          REVISION: ${{ github.sha }}
        run: node scripts/create-artifact-manifest.mjs --revision "$REVISION"

      - name: Upload visual candidate
        id: site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-site-${{ github.sha }}
          path: |
            dist/
            tmp/delivery/site-artifact-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload browser diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-diagnostics-ci
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn

  visual:
    needs: quality
    uses: ./.github/workflows/visual-tests.yml
    with:
      revision: ${{ github.sha }}
      artifact-id: ${{ needs.quality.outputs.artifact-id }}
      update-baselines: ${{ github.event_name == 'workflow_dispatch' && inputs.update-baselines }}

  artifact_gate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify-site-artifact && !inputs.update-baselines }}
    uses: ./.github/workflows/site-artifact.yml
    with:
      revision: ${{ github.sha }}

  check:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.update-baselines && 'Baseline Candidates' || 'Check' }}
    if: ${{ always() }}
    needs: [quality, visual]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout gate validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require every test gate
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          VISUAL_RESULT: ${{ needs.visual.result }}
        run: node scripts/validate-test-gates.mjs
