name: Milestone Sync

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "docs/planning/roadmap.md"
  issues:
    types:
      - opened
      - edited
      - reopened
      - closed
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - closed

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: milestone-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Milestone Sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout default branch workflow source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Synchronize milestones and assignments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-github-milestones.mjs
